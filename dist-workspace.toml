[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# D-02/D-05: famp, famp-gateway, famp-relay across exactly these 3 triples --
# no aarch64-unknown-linux-gnu, no windows.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in (D-07: same target `just install` uses, ~/.cargo/bin)
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Checksum algorithm for release artifacts (T-16-01 / DIST-03)
checksum = "sha256"
# DIST-02: a no-Rust-toolchain container job that curls the documented
# installer against the real published release and asserts both binaries
# work. Runs post-announce because it needs release assets that exist only
# once a release is actually published. Does NOT satisfy DOC-07 -- see the
# header comment in .github/workflows/install-gate.yml.
post-announce-jobs = ["./install-gate"]

[dist.github-custom-runners]
# D-04: pin the Linux glibc floor deliberately (2.35) rather than letting it
# drift with each ubuntu-latest LTS roll. Matches dist 0.32's own built-in
# default runner for this target -- pinned explicitly here so the choice is
# recorded, not implicit.
x86_64-unknown-linux-gnu = "ubuntu-22.04"
# D-08a (see 16-D08-EVIDENCE.md, run 30782329455): a real arm64 macos-latest
# runner cross-builds x86_64-apple-darwin cleanly for all three binaries.
# dist 0.32's own default would otherwise put this target on the separate
# macos-15-intel runner class GitHub has published a sunset date for; pinning
# it onto the same arm64 runner as aarch64-apple-darwin avoids that class
# entirely, per the resolution D-08 recorded.
x86_64-apple-darwin = "macos-14"
