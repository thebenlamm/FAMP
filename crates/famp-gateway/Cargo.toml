[package]
name = "famp-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "FAMP v0.5.2 — famp-gateway crate (Layer 2 cross-host federation gateway, shipped v1.0; INV-10)"

[lints]
workspace = true

[dependencies]
famp-bus            = { path = "../famp-bus", version = "1.0.0" }
famp                = { path = "../famp", version = "1.0.0" }
famp-keyring        = { path = "../famp-keyring", version = "1.0.0" }
famp-envelope       = { path = "../famp-envelope", version = "1.0.0" }
famp-crypto         = { path = "../famp-crypto", version = "1.0.0" }
famp-transport      = { path = "../famp-transport", version = "1.0.0" }
famp-transport-http = { path = "../famp-transport-http", version = "1.0.0" }
tokio      = { workspace = true, features = ["rt", "sync", "macros", "net", "signal"] }
thiserror  = { workspace = true }
serde_json = { workspace = true }
uuid       = { workspace = true }
axum       = "0.8"
tower      = "0.5"
tower-http = { version = "0.6", features = ["limit"] }
url        = "2"
time       = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3"
famp-inspect-proto = { path = "../famp-inspect-proto", version = "1.0.0" }

[[bin]]
name = "famp-gateway"
path = "src/main.rs"
