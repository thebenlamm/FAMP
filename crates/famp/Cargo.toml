[package]
name = "famp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "FAMP v0.5.2 — umbrella crate and CLI"

[lints.rust]
# Inherit the workspace clippy/rust lint set, but downgrade `unsafe_code`
# from `forbid` to `deny` so `bus_client::spawn` can opt-in via a single
# narrowly-scoped `#[allow(unsafe_code)]` for the locked Q1 broker-spawn
# pattern (`Command::new` + child-side `pre_exec(setsid)` per RESEARCH).
# Every other module in the crate keeps the `deny` posture and the lib
# root retains `#![forbid(unsafe_code)]` outside `bus_client::spawn`.
unsafe_code = "deny"
unused_crate_dependencies = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Mirror the workspace allow-list (Cargo lint tables don't merge — see
# workspace Cargo.toml for rationale). Keep in sync with [workspace.lints.clippy].
doc_markdown = "allow"
similar_names = "allow"
option_if_let_else = "allow"

[dependencies]
famp-core = { path = "../famp-core", version = "1.1.0-rc.1" }
famp-canonical = { path = "../famp-canonical", version = "1.1.0-rc.1" }
famp-crypto = { path = "../famp-crypto", version = "1.1.0-rc.1" }
famp-envelope = { path = "../famp-envelope", version = "1.1.0-rc.1" }
famp-fsm = { path = "../famp-fsm", version = "1.1.0-rc.1" }
famp-inbox = { path = "../famp-inbox", version = "1.1.0-rc.1" }
famp-taskdir = { path = "../famp-taskdir", version = "1.1.0-rc.1" }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time", "process", "io-util", "io-std", "signal", "net"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
url = "2"
base64 = { workspace = true }
clap = { version = "4.6", features = ["derive", "env"] }
toml = "1.1"
tempfile = "3"
time = { version = "0.3", features = ["serde-well-known", "formatting", "macros", "parsing"] }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
humantime = "2"
famp-bus = { path = "../famp-bus", version = "1.1.0-rc.1" }
famp-inspect-server = { path = "../famp-inspect-server", version = "1.1.0-rc.1" }
famp-inspect-proto = { path = "../famp-inspect-proto", version = "1.1.0-rc.1" }
famp-inspect-client = { path = "../famp-inspect-client", version = "1.1.0-rc.1" }
nix = { version = "0.31", features = ["process", "fs", "signal", "user"] }
dirs = "5"
regex = { workspace = true }
which = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
# famp-keyring is a REAL dependency (not dev-only): `famp peer
# export`/`import` (Phase 8, TRUST-01) read/write the gateway peer
# keyring at runtime, not just in tests.
famp-keyring = { path = "../famp-keyring", version = "1.1.0-rc.1" }
# 18-01 (PAIR-01): `famp pair redeem`'s outbound HTTPS POST to the
# inviter's gateway. Same crate/version/feature-set famp-gateway,
# famp-relay, and famp-transport-http already declare directly (NOT
# `{ workspace = true }` — the root workspace `[workspace.dependencies]`
# reqwest entry names a feature, `rustls-tls-native-roots`, that does not
# exist on reqwest 0.13.x; every other workspace member already avoids it
# by declaring reqwest inline with `rustls-no-provider`, the manually-
# provider-installed variant `famp_transport_http::tls::build_client_config`
# is written against). `rustls-no-provider` + `install_default_provider()`
# (called internally by `build_client_config`) is the SAME construction
# this crate's `cli::pair::redeem` uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
# 18-01: `cli::pair::redeem` builds its outbound `reqwest::Client` via
# `famp_transport_http::tls::build_client_config` — the SAME
# TLS-preconfigured-client construction `famp-gateway`'s `relay_fetch.rs`
# uses internally, rather than standing up a second TLS stack. Promoted
# from dev-only (previously below, `famp-transport-http` was test-only)
# to a REAL dependency for this reason; no cycle — famp-transport-http
# does not depend on this crate.
famp-transport-http = { path = "../famp-transport-http", version = "1.1.0-rc.1" }
[dev-dependencies]
# test-util feature of famp-transport is ONLY enabled in dev-dependencies so
# send_raw_for_test is unreachable from production builds (D-D6).
famp-transport = { path = "../famp-transport", version = "1.1.0-rc.1", features = ["test-util"] }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time", "test-util", "process", "io-util", "signal", "net"] }
axum = "0.8"
assert_cmd = "2.0"
insta = { version = "1.47.2", features = ["json"] }
# WR-06: scoped env-var mutation for tests. Replaces the manual
# save/set/restore dance in identity.rs / bus_client / mcp_register_whoami
# tests; required before Rust 2024 makes `std::env::set_var` `unsafe fn`.
temp-env = "0.3"

[[bin]]
name = "famp"
path = "src/bin/famp.rs"
