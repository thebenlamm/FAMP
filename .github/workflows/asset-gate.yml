# ci.yml excludes **/*.md from its push/pull_request triggers (paths-ignore),
# and crates/famp/assets/slash_commands/*.md are .md files — so an assets-only
# commit produces ZERO check-runs under ci.yml and the schema gate in
# crates/famp/tests/slash_command_assets.rs never fires on the exact change
# it exists to catch. This workflow is purely additive: it does not touch
# ci.yml, it only covers that dark commit-shape path.
#
# See quick task 260729-ur8.
name: asset-gate

on:
  push:
    branches: ["**"]
    paths:
      - "crates/famp/assets/slash_commands/**"
      - "crates/famp/tests/slash_command_assets.rs"
      # The test recovers the tool registry by parsing this file as text and
      # pins it at 12 descriptors, so a registry change here is half of the
      # drift pair the gate watches. ci.yml's workspace test job already covers
      # .rs commits, but that makes this gate's ground truth depend on another
      # workflow's job set: if ci.yml ever narrows, the 12-pin would die
      # silently. Listing it here keeps asset-gate self-sufficient.
      - "crates/famp/src/cli/mcp/server.rs"
      - ".github/workflows/asset-gate.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "crates/famp/assets/slash_commands/**"
      - "crates/famp/tests/slash_command_assets.rs"
      # The test recovers the tool registry by parsing this file as text and
      # pins it at 12 descriptors, so a registry change here is half of the
      # drift pair the gate watches. ci.yml's workspace test job already covers
      # .rs commits, but that makes this gate's ground truth depend on another
      # workflow's job set: if ci.yml ever narrows, the 12-pin would die
      # silently. Listing it here keeps asset-gate self-sufficient.
      - "crates/famp/src/cli/mcp/server.rs"
      - ".github/workflows/asset-gate.yml"

concurrency:
  group: asset-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  asset-gate:
    name: asset-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p famp --test slash_command_assets
