# ci.yml excludes docs/** and **/*.md from its push/pull_request triggers
# (paths-ignore), so a docs-only commit produces ZERO check-runs under
# ci.yml and the accuracy gate in
# crates/famp/tests/install_docs_accuracy.rs would never fire on the exact
# change it exists to catch. This workflow is purely additive: it does not
# touch ci.yml, it only covers that dark commit-shape path.
#
# See 16-04-PLAN.md (DIST-04).
name: install-docs-gate

on:
  push:
    branches: ["**"]
    paths:
      - "README.md"
      - "docs/**"
      - "crates/famp/tests/install_docs_accuracy.rs"
      # The fallback-parity assertion cross-checks the README fallback
      # command against this file's install step, so a change here is
      # half of the drift pair the gate watches.
      - ".github/workflows/smoke-test.yml"
      - ".github/workflows/install-docs-gate.yml"
      - "scripts/check-doc-release-urls.sh"
  pull_request:
    branches: ["**"]
    paths:
      - "README.md"
      - "docs/**"
      - "crates/famp/tests/install_docs_accuracy.rs"
      # The fallback-parity assertion cross-checks the README fallback
      # command against this file's install step, so a change here is
      # half of the drift pair the gate watches.
      - ".github/workflows/smoke-test.yml"
      - ".github/workflows/install-docs-gate.yml"
      - "scripts/check-doc-release-urls.sh"
  # Daily schedule to catch release-side 404s (e.g., prerelease flag changes,
  # release deletion). 02:00 UTC chosen as a low-traffic time. The URL gate
  # exists to surface 404s without waiting for a docs-path commit.
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: install-docs-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-docs-gate:
    name: install-docs-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p famp --test install_docs_accuracy

      # DIST-04 gap closure. install_docs_accuracy.rs asserts ordering,
      # wording, and fallback parity -- but nothing asserted a documented
      # download URL actually returns anything. Phase 16 verification found
      # all ten `/releases/latest/download/...` URLs returning 404 while this
      # gate was green, because GitHub's `/latest/` alias skips pre-releases.
      # Kept out of `cargo test` so unit tests stay hermetic and offline-safe.
      - name: Documented release URLs resolve
        run: bash scripts/check-doc-release-urls.sh
