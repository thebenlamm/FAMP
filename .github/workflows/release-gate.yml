# release.yml and the three installer fixtures under
# crates/famp/tests/fixtures/installers/ are generated from
# dist-workspace.toml (dist 0.32's actual config file — not
# [workspace.metadata.dist] in Cargo.toml, which holds no dist config).
# Both only ever execute at tag time, so a hand edit or a stale
# regeneration is invisible until a release is already wrong. This
# workflow is purely additive — it does not touch ci.yml's triggers
# (repo convention, stated in asset-gate.yml's own header) — and covers
# the exact commit shapes that could introduce that drift, or a second
# producer of release assets (DIST-05).
#
# NOTE: The paths list is itself a decay vector. A new .github/workflows/**
# file that produces release assets, a version bump without a Cargo.toml
# change, or a new scripts/*.sh file could all proceed without this gate
# firing. Each path entry is load-bearing — coverage gaps == failure modes.
name: release-gate

on:
  push:
    branches: ["**"]
    paths:
      - "dist-workspace.toml"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/famp/tests/fixtures/installers/**"
      - "scripts/**"
      # hook-runner.sh and famp-await.sh are shellchecked by
      # `just check-shellcheck`, which this workflow runs. Without this path
      # they were shellchecked nowhere in CI.
      - "crates/famp/assets/**"
      - "Justfile"
  pull_request:
    branches: ["**"]
    paths:
      - "dist-workspace.toml"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/famp/tests/fixtures/installers/**"
      - "scripts/**"
      # hook-runner.sh and famp-await.sh are shellchecked by
      # `just check-shellcheck`, which this workflow runs. Without this path
      # they were shellchecked nowhere in CI.
      - "crates/famp/assets/**"
      - "Justfile"

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # Validates workflow files themselves. Catches a class local YAML
      # parsing cannot: Actions substitutes expression syntax into run:
      # blocks textually, ignoring shell comment syntax, so an empty
      # expression inside a comment invalidates the whole file -- surfacing
      # only as a zero-job failed run with no logs.
      - name: Install actionlint
        uses: taiki-e/install-action@v2
        with:
          tool: actionlint
      - name: Install shellcheck 0.11.0 (pinned via taiki-e action)
        uses: taiki-e/install-action@v2
        with:
          tool: shellcheck@0.11.0
      - name: Install dist 0.32.0 (not in taiki-e/install-action's tool set)
        run: cargo install cargo-dist --version 0.32.0 --locked
      - name: DIST-05 sole-producer gate
        run: just check-release-artifact-source
      - name: Shellcheck the hook assets + installer fixtures
        run: just check-shellcheck

      - name: Workflow files are valid (actionlint)
        run: just check-actionlint
      - name: dist-derived-file drift gate
        run: just check-installer-drift
