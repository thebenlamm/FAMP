# actionlint configuration.
#
# .github/workflows/release.yml is generated by `dist generate` and must never
# be hand-edited, so its style-level findings (SC2086/SC2129 in generated
# shell) are not actionable here. Ignoring them keeps this gate meaningful
# rather than permanently red. The generated file is protected separately by
# `just check-installer-drift`, which regenerates and diffs it.
#
# This is scoped to that ONE generated file, by name. Do not widen it.
paths:
  .github/workflows/release.yml:
    ignore:
      - ".*"
